# Enable necessary modules if they are not already enabled
# If mod_remoteip is available, it's the best way to ensure the
# remote address is correctly set for PHP logs.
# LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so

# Set the external IP address based on the proxy headers.
# This assumes the proxy sends X-Forwarded-For (for IP)
RemoteIPHeader X-Forwarded-For

# IMPORTANT: Configure the proxy settings so PHP knows the original protocol (HTTPS)
# This uses mod_headers to set an environment variable when HTTPS is detected
# (based on the proxy sending the X-Forwarded-Proto header)

# If the request came in as HTTPS (indicated by the proxy), set an environment variable
RequestHeader set X-Forwarded-Proto "https" env=HTTPS_IS_ON
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

# If the application uses HTTP_X_FORWARDED_PROTO, ensure it's set
SetEnvIf X-Forwarded-Proto "https" HTTP_X_FORWARDED_PROTO=https

# This setting might be specific to FileSender's index.php logic, but is good practice:
# Set the Server Name using the Host header provided by the client
UseCanonicalName Off